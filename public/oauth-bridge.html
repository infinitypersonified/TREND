<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Signing you in…</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="authpage"><div class="authcard" style="text-align:center">
  <div class="logo">trend</div>
  <p class="sub" style="margin-top:14px">Signing you in…</p>
</div></div>
<script src="app.js"></script>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const next = params.get('next') || 'app.html';
  if (!token) { location.href = 'login.html'; return; }
  try {
    const res = await fetch('/api/me', { headers: { authorization: `Bearer ${token}` } });
    if (!res.ok) throw new Error('bad token');
    const user = await res.json();
    Trend.setSession(token, user);
    location.href = next;
  } catch (e) {
    location.href = 'login.html?error=google_failed';
  }
})();
</script>
</body>
</html>
